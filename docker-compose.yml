services:
  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    container_name: healthtechops-postgres
    environment:
      POSTGRES_DB: healthtechops
      POSTGRES_USER: healthtechops
      POSTGRES_PASSWORD: healthtechops
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthtechops"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: healthtechops-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - monitoring-agent

  # Grafana
  grafana:
    image: grafana/grafana-oss:latest
    container_name: healthtechops-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: healthtechops
      GF_INSTALL_PLUGINS: grafana-clock-panel
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infrastructure/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
      - loki

  # Loki (log aggregation)
  loki:
    image: grafana/loki:latest
    container_name: healthtechops-loki
    command: -config.file=/etc/loki/loki-config.yml
    ports:
      - "3100:3100"
    volumes:
      - ./infrastructure/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki

  # FastAPI backend
  backend:
    build:
      context: ./backend
      dockerfile: ../infrastructure/docker/Dockerfile.backend
    container_name: healthtechops-backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://healthtechops:healthtechops@postgres:5432/healthtechops
      SIMULATOR_HOST: simulator
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app

  # Synthetic services simulator
  simulator:
    build:
      context: ./synthetic-services
      dockerfile: ../infrastructure/docker/Dockerfile.simulator
    container_name: healthtechops-simulator
    ports:
      - "8010:8010"
      - "8011:8011"
      - "8012:8012"
      - "8013:8013"
      - "8014:8014"
      - "8015:8015"

  # Monitoring agent
  monitoring-agent:
    build:
      context: ./monitoring
      dockerfile: ../infrastructure/docker/Dockerfile.monitoring
    container_name: healthtechops-monitoring
    environment:
      SIMULATOR_HOST: simulator
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro

  # Frontend (production build)
  frontend:
    build:
      context: ./frontend
      dockerfile: ../infrastructure/docker/Dockerfile.frontend
    container_name: healthtechops-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  loki_data:
