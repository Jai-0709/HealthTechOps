global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'healthtechops-monitoring'
    static_configs:
      - targets: ['monitoring-agent:9100']
    
  - job_name: 'healthtechops-backend'
    static_configs:
      - targets: ['backend:8000']
    metrics_path: /metrics

  - job_name: 'synthetic-services'
    static_configs:
      - targets: 
        - 'simulator:8010'
        - 'simulator:8011'
        - 'simulator:8012'
        - 'simulator:8013'
        - 'simulator:8014'
        - 'simulator:8015'
    metrics_path: /prometheus-metrics
